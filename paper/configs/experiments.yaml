# 실험 조건과 담당 묶음. 조건 ID는 논문·결과 파일·공유 시트에서 모두 같은 이름으로 쓴다.
# text: 텍스트 임베딩 사용 여부 / image: 이미지 인코더 / shuffle: null | global | type (같은 product_type_name 안)

conditions:
  C0:  {text: true,  image: null,     shuffle: null}
  C1:  {text: false, image: marqo,    shuffle: null}
  C2:  {text: true,  image: marqo,    shuffle: null}
  C3:  {text: true,  image: marqo,    shuffle: global}
  C4:  {text: true,  image: marqo,    shuffle: type}
  C5:  {text: false, image: resnet50, shuffle: null}
  C6:  {text: true,  image: resnet50, shuffle: null}
  C7:  {text: true,  image: resnet50, shuffle: global}
  C8:  {text: true,  image: resnet50, shuffle: type}
  C9:  {text: false, image: clipb32,  shuffle: null}
  C10: {text: true,  image: clipb32,  shuffle: null}
  C11: {text: true,  image: clipb32,  shuffle: global}
  C12: {text: true,  image: clipb32,  shuffle: type}
  # 추가 분석 (2026-09-29, 결과 확인 후 추가 — 사전 등록 아님): 상품 타워에 인기도 입력
  P0:  {text: true,  image: null,     shuffle: null,   pop: true}
  P2:  {text: true,  image: marqo,    shuffle: null,   pop: true}
  P3:  {text: true,  image: marqo,    shuffle: global, pop: true}
  P4:  {text: true,  image: marqo,    shuffle: type,   pop: true}
  # 2차 사전 등록 (prereg_v2.yaml). id: 상품 ID 임베딩 사용, id_setting: 튜닝 선택값 대신 강제할 후보 (민감도 분석)
  S2:  {text: true,  image: siglip_b16,   shuffle: null}
  S3:  {text: true,  image: siglip_b16,   shuffle: global}
  S4:  {text: true,  image: siglip_b16,   shuffle: type}
  L2:  {text: true,  image: laion_b32,    shuffle: null}
  L3:  {text: true,  image: laion_b32,    shuffle: global}
  L4:  {text: true,  image: laion_b32,    shuffle: type}
  FC2: {text: true,  image: fashionclip2, shuffle: null}
  FC3: {text: true,  image: fashionclip2, shuffle: global}
  FC4: {text: true,  image: fashionclip2, shuffle: type}
  I0:  {text: true,  image: null,         shuffle: null,   id: true}
  I2:  {text: true,  image: marqo,        shuffle: null,   id: true}
  I3:  {text: true,  image: marqo,        shuffle: global, id: true}
  I4:  {text: true,  image: marqo,        shuffle: type,   id: true}
  IS2: {text: true,  image: siglip_b16,   shuffle: null,   id: true}
  IS3: {text: true,  image: siglip_b16,   shuffle: global, id: true}
  IS4: {text: true,  image: siglip_b16,   shuffle: type,   id: true}
  J0:  {text: true,  image: null,         shuffle: null,   id: true, id_setting: i2}
  J2:  {text: true,  image: marqo,        shuffle: null,   id: true, id_setting: i2}
  J3:  {text: true,  image: marqo,        shuffle: global, id: true, id_setting: i2}
  J4:  {text: true,  image: marqo,        shuffle: type,   id: true, id_setting: i2}
  JS2: {text: true,  image: siglip_b16,   shuffle: null,   id: true, id_setting: i2}
  JS3: {text: true,  image: siglip_b16,   shuffle: global, id: true, id_setting: i2}
  JS4: {text: true,  image: siglip_b16,   shuffle: type,   id: true, id_setting: i2}
  # 3차 사전 등록 김유환 (prereg_yh_fusion.yaml). text_dropout / image_dropout: 학습 중 해당 블록을 확률 p로 0
  # fusion: concat(기본) | late | gate
  YH_TD1R: {text: true, image: marqo, shuffle: null,   text_dropout: 0.1}
  YH_TD1G: {text: true, image: marqo, shuffle: global, text_dropout: 0.1}
  YH_TD3R: {text: true, image: marqo, shuffle: null,   text_dropout: 0.3}
  YH_TD3G: {text: true, image: marqo, shuffle: global, text_dropout: 0.3}
  YH_TD5R: {text: true, image: marqo, shuffle: null,   text_dropout: 0.5}
  YH_TD5G: {text: true, image: marqo, shuffle: global, text_dropout: 0.5}
  YH_VD1R: {text: true, image: marqo, shuffle: null,   image_dropout: 0.1}
  YH_VD1G: {text: true, image: marqo, shuffle: global, image_dropout: 0.1}
  YH_VD3R: {text: true, image: marqo, shuffle: null,   image_dropout: 0.3}
  YH_VD3G: {text: true, image: marqo, shuffle: global, image_dropout: 0.3}
  YH_VD5R: {text: true, image: marqo, shuffle: null,   image_dropout: 0.5}
  YH_VD5G: {text: true, image: marqo, shuffle: global, image_dropout: 0.5}
  YH_LR:   {text: true, image: marqo, shuffle: null,   fusion: late}
  YH_LG:   {text: true, image: marqo, shuffle: global, fusion: late}
  YH_GR:   {text: true, image: marqo, shuffle: null,   fusion: gate}
  YH_GG:   {text: true, image: marqo, shuffle: global, fusion: gate}

  # 4차 사전 등록 김유환 (prereg_yh_imgdrop.yaml), s2 분할에서 실행. 기존 조건(C2 · C3 · YH_VD · YH_TD)도 s2 묶음에서 재사용
  # dropout_rescale: 남은 이미지 블록 1/(1−p)배 / image_elem_dropout: 원소 단위 / test_img_scale: 추천 때 상품 이미지 s배
  # image_control: random(상품별 무작위 벡터) | const(모든 상품 같은 벡터), image 값은 차원 참조용
  YH_VS1R: {text: true, image: marqo, shuffle: null,   image_dropout: 0.1, dropout_rescale: true}
  YH_VS1G: {text: true, image: marqo, shuffle: global, image_dropout: 0.1, dropout_rescale: true}
  YH_VS3R: {text: true, image: marqo, shuffle: null,   image_dropout: 0.3, dropout_rescale: true}
  YH_VS3G: {text: true, image: marqo, shuffle: global, image_dropout: 0.3, dropout_rescale: true}
  YH_VS5R: {text: true, image: marqo, shuffle: null,   image_dropout: 0.5, dropout_rescale: true}
  YH_VS5G: {text: true, image: marqo, shuffle: global, image_dropout: 0.5, dropout_rescale: true}
  YH_VE1R: {text: true, image: marqo, shuffle: null,   image_elem_dropout: 0.1}
  YH_VE3R: {text: true, image: marqo, shuffle: null,   image_elem_dropout: 0.3}
  YH_VE5R: {text: true, image: marqo, shuffle: null,   image_elem_dropout: 0.5}
  YH_TV1R: {text: true, image: marqo, shuffle: null,   text_dropout: 0.1, image_dropout: 0.1}
  YH_TV3R: {text: true, image: marqo, shuffle: null,   text_dropout: 0.1, image_dropout: 0.3}
  YH_TV5R: {text: true, image: marqo, shuffle: null,   text_dropout: 0.1, image_dropout: 0.5}
  YH_TS2R: {text: true, image: marqo, shuffle: null,   test_img_scale: 2.0}
  YH_RN0:  {text: true, image: marqo, shuffle: null,   image_control: random}
  YH_RN5:  {text: true, image: marqo, shuffle: null,   image_control: random, text_dropout: 0.5}
  YH_CN0:  {text: true, image: marqo, shuffle: null,   image_control: const}
  YH_CN5:  {text: true, image: marqo, shuffle: null,   image_control: const,  text_dropout: 0.5}

  # 6차 사전 등록 김유환 (prereg_yh_balance.yaml): 인코더별 이미지 · 텍스트 드롭아웃 0.3, 범용 SigLIP 이미지만
  YH4_SVD: {text: true,  image: siglip_b16, shuffle: null, image_dropout: 0.3}
  YH4_RVD: {text: true,  image: resnet50,   shuffle: null, image_dropout: 0.3}
  YH4_CVD: {text: true,  image: clipb32,    shuffle: null, image_dropout: 0.3}
  YH4_STD: {text: true,  image: siglip_b16, shuffle: null, text_dropout: 0.3}
  YH4_RTD: {text: true,  image: resnet50,   shuffle: null, text_dropout: 0.3}
  YH4_CTD: {text: true,  image: clipb32,    shuffle: null, text_dropout: 0.3}
  YH4_SI:  {text: false, image: siglip_b16, shuffle: null}

  # 7차 사전 등록 김유환 (prereg_yh_image_use.yaml): 이미지 잡음 σ
  YH5_N1: {text: true, image: marqo, shuffle: null, image_noise: 0.03}
  YH5_N2: {text: true, image: marqo, shuffle: null, image_noise: 0.06}
  YH5_N3: {text: true, image: marqo, shuffle: null, image_noise: 0.12}

# 인코더별 조건 묶음 (분석에서 기여도 계산에 사용)
families:
  marqo:    {text_only: C0, image_only: C1, real: C2, shuffle_global: C3, shuffle_type: C4}
  resnet50: {text_only: C0, image_only: C5, real: C6, shuffle_global: C7, shuffle_type: C8}
  clipb32:  {text_only: C0, image_only: C9, real: C10, shuffle_global: C11, shuffle_type: C12}
  marqo_pop: {text_only: P0, real: P2, shuffle_global: P3, shuffle_type: P4}

# 실험 묶음: 한 묶음은 한 사람의 GPU에서 전부 돌린다 (직접 비교하는 조건은 같은 컴퓨터).
groups:
  A:   # 주 검정 (Marqo), 13회
    - {conds: [C0, C2, C3, C4], seeds: [42, 43, 44], split: main}
    - {conds: [C1], seeds: [42], split: main}
  B:   # 인코더 비교 (ResNet-50), 5회 + 추가 seed 10회
    - {conds: [C0, C5, C6, C7, C8], seeds: [42], split: main}
    - {conds: [C0, C5, C6, C7, C8], seeds: [43, 44], split: main}    # 추가 (2026-09-29)
  C:   # 인코더 비교 (CLIP) + 다른 테스트 주, 9회 + 추가 seed 10회. 베이스라인·비학습 방식은 04_baselines
    - {conds: [C0, C9, C10, C11, C12], seeds: [42], split: main}
    - {conds: [C0, C2, C3, C4], seeds: [42], split: alt}
    - {conds: [C0, C9, C10, C11, C12], seeds: [43, 44], split: main}  # 추가 (2026-09-29)
  D:   # 추가 분석 (2026-09-29): 인기도 입력 버전으로 주 검정 조건 반복, 12회
    - {conds: [P0, P2, P3, P4], seeds: [42, 43, 44], split: main}
  # ---- 2차 사전 등록 (prereg_v2.yaml). 07 노트북이 실행한다 (06의 전체 실행 대상 아님)
  E:   # H1 · 재현 쌍: ID 없음, 새 인코더 3종, 27회
    - {conds: [S2, S3, S4, L2, L3, L4, FC2, FC3, FC4], seeds: [42, 43, 44], split: main}
  F:   # H2: ID 있음 (튜닝 선택 설정), 21회
    - {conds: [I0, I2, I3, I4, IS2, IS3, IS4], seeds: [42, 43, 44], split: main}
  G:   # ID 드롭아웃 0 (i2) 민감도, 21회. 선택 설정이 i2면 실행하지 않는다
    - {conds: [J0, J2, J3, J4, JS2, JS3, JS4], seeds: [42, 43, 44], split: main}

  # ---- 3차 사전 등록 김유환 (prereg_yh_fusion.yaml). 08 노트북이 실행한다
  YH_TD:   # 텍스트 드롭아웃 p 3개 × 진짜 · 전체 섞기, 18회
    - {conds: [YH_TD1R, YH_TD1G, YH_TD3R, YH_TD3G, YH_TD5R, YH_TD5G], seeds: [42, 43, 44], split: main}
  YH_FU:   # 결합 구조 late · gate × 진짜 · 전체 섞기, 12회
    - {conds: [YH_GR, YH_GG, YH_LR, YH_LG], seeds: [42, 43, 44], split: main}
  YH_VD:   # 이미지 드롭아웃 대조 (탐색적), 18회
    - {conds: [YH_VD1R, YH_VD1G, YH_VD3R, YH_VD3G, YH_VD5R, YH_VD5G], seeds: [42, 43, 44], split: main}

  # ---- 4차 사전 등록 김유환 (prereg_yh_imgdrop.yaml). 09 노트북이 실행한다. 모두 s2 분할
  YH2_BASE:  # 기준 (이어 붙이기) 6회
    - {conds: [C2, C3], seeds: [42, 43, 44], split: s2}
  YH2_VD:    # 이미지 드롭아웃 (배율 보정 없음) 18회 — H5
    - {conds: [YH_VD1R, YH_VD1G, YH_VD3R, YH_VD3G, YH_VD5R, YH_VD5G], seeds: [42, 43, 44], split: s2}
  YH2_VS:    # 배율 보정 이미지 드롭아웃 18회 — H6
    - {conds: [YH_VS1R, YH_VS1G, YH_VS3R, YH_VS3G, YH_VS5R, YH_VS5G], seeds: [42, 43, 44], split: s2}
  YH2_X:     # 탐색: 원소 단위 · 텍스트 + 이미지 드롭아웃 · 추천 때 배율 · H3 재현, 27회
    - {conds: [YH_VE1R, YH_VE3R, YH_VE5R, YH_TV1R, YH_TV3R, YH_TV5R, YH_TS2R, YH_TD1R, YH_TD1G], seeds: [42, 43, 44], split: s2}
  YH2_CTRL:  # 탐색 0-2: 대조군 종류 × 텍스트 드롭아웃 0 · 0.5, 15회 (섞은 이미지 td 0은 YH2_BASE의 C3)
    - {conds: [YH_TD5G, YH_RN0, YH_RN5, YH_CN0, YH_CN5], seeds: [42, 43, 44], split: s2}

  # ---- 5차 사전 등록 김유환 (prereg_yh_where.yaml). s2 분할. 베이스라인 B1 · B2는 baselines.run(group="YH3_BASE")
  YH3_ENC:   # 텍스트만 + 인코더 4종 (진짜 · 전체 섞기), 27회
    - {conds: [C0, L2, L3, C10, C11, S2, S3, C6, C7], seeds: [42, 43, 44], split: s2}

  # ---- 6차 사전 등록 김유환 (prereg_yh_balance.yaml). s2. counterfactual: 평균 대체 추천도 함께 저장 (활용도 지표)
  YH4:       # 인코더 4종 × {기준, 이미지 드롭아웃, 텍스트 드롭아웃, 이미지만}, 48회
    - {conds: [C2, S2, C6, C10, YH_VD3R, YH4_SVD, YH4_RVD, YH4_CVD, YH_TD3R, YH4_STD, YH4_RTD, YH4_CTD, C1, YH4_SI, C5, C9],
       seeds: [42, 43, 44], split: s2, counterfactual: true}

  # ---- 7차 사전 등록 김유환 (prereg_yh_image_use.yaml). s4. insample: 학습 주 재채점, save_vectors: UME용 벡터 저장
  YH5_ENC:    # 인코더 4종 × {기준, 이미지 드롭아웃 0.3}, 24회
    - {conds: [C2, S2, C6, C10, YH_VD3R, YH4_SVD, YH4_RVD, YH4_CVD], seeds: [42, 43, 44], split: s4, insample: true}
  YH5_NOISE:  # Marqo 이미지 잡음 σ 3개, 9회
    - {conds: [YH5_N1, YH5_N2, YH5_N3], seeds: [42, 43, 44], split: s4, insample: true}
  YH5_UME:    # 텍스트만 · 이미지만 (Marqo, ResNet), 9회
    - {conds: [C0, C1, C5], seeds: [42, 43, 44], split: s4, save_vectors: true, insample: true}

  # 김광석 보너스 과제(MMR · ONNX)용: 7차 기준 조건 C2를 같은 설정으로 다시 학습해 가중치 · 벡터 저장 (사전 등록 대상 아님)
  YH5_EXPORT:
    - {conds: [C2], seeds: [42], split: s4, save_model: true, save_vectors: true}

  # ---- 8차 사전 등록 김유환 (prereg_yh_ume.yaml). 모든 실행 벡터 저장 (앙상블 · UME 계산용)
  YH6_S2:     # s2 확증: 텍스트만 · 이미지만(Marqo · SigLIP · ResNet) · 함께 학습, 15회
    - {conds: [C0, C1, C2, YH4_SI, C5], seeds: [42, 43, 44], split: s2, save_vectors: true}
  YH6_MAIN:   # main 재현: 텍스트만 · 이미지만(Marqo) · 함께 학습, 9회
    - {conds: [C0, C1, C2], seeds: [42, 43, 44], split: main, save_vectors: true}

# 2차 분석의 조건 묶음: (묶음, 조건). text_only는 상대 기여도에 쓰지 않고 표의 참고값으로만 쓴다
v2_cells:
  noid_marqo:        {real: [A, C2],  shuffle_global: [A, C3],  shuffle_type: [A, C4],  text_only: [A, C0]}
  noid_siglip_b16:   {real: [E, S2],  shuffle_global: [E, S3],  shuffle_type: [E, S4],  text_only: [A, C0]}
  noid_fashionclip2: {real: [E, FC2], shuffle_global: [E, FC3], shuffle_type: [E, FC4], text_only: [A, C0]}
  noid_laion_b32:    {real: [E, L2],  shuffle_global: [E, L3],  shuffle_type: [E, L4],  text_only: [A, C0]}
  noid_resnet50:     {real: [B, C6],  shuffle_global: [B, C7],  shuffle_type: [B, C8],  text_only: [B, C0]}
  noid_clipb32:      {real: [C, C10], shuffle_global: [C, C11], shuffle_type: [C, C12], text_only: [C, C0]}
  id_marqo:          {real: [F, I2],  shuffle_global: [F, I3],  shuffle_type: [F, I4],  text_only: [F, I0]}
  id_siglip_b16:     {real: [F, IS2], shuffle_global: [F, IS3], shuffle_type: [F, IS4], text_only: [F, I0]}
  i2_marqo:          {real: [G, J2],  shuffle_global: [G, J3],  shuffle_type: [G, J4],  text_only: [G, J0]}
  i2_siglip_b16:     {real: [G, JS2], shuffle_global: [G, JS3], shuffle_type: [G, JS4], text_only: [G, J0]}

# 3차 분석 (김유환)의 조건 묶음: (묶음, 조건). base_concat은 기존 묶음 A 재사용
yh_cells:
  base_concat: {real: [A, C2],          shuffle_global: [A, C3]}
  td10:        {real: [YH_TD, YH_TD1R], shuffle_global: [YH_TD, YH_TD1G]}
  td30:        {real: [YH_TD, YH_TD3R], shuffle_global: [YH_TD, YH_TD3G]}
  td50:        {real: [YH_TD, YH_TD5R], shuffle_global: [YH_TD, YH_TD5G]}
  vd10:        {real: [YH_VD, YH_VD1R], shuffle_global: [YH_VD, YH_VD1G]}
  vd30:        {real: [YH_VD, YH_VD3R], shuffle_global: [YH_VD, YH_VD3G]}
  vd50:        {real: [YH_VD, YH_VD5R], shuffle_global: [YH_VD, YH_VD5G]}
  late:        {real: [YH_FU, YH_LR],   shuffle_global: [YH_FU, YH_LG]}
  gate:        {real: [YH_FU, YH_GR],   shuffle_global: [YH_FU, YH_GG]}

# 4차 분석 (김유환)의 조건 묶음 — 모두 s2 분할의 실행
yh2_cells:
  base:   {real: [YH2_BASE, C2],     shuffle_global: [YH2_BASE, C3]}
  vd10:   {real: [YH2_VD, YH_VD1R],  shuffle_global: [YH2_VD, YH_VD1G]}
  vd30:   {real: [YH2_VD, YH_VD3R],  shuffle_global: [YH2_VD, YH_VD3G]}
