# 9차 사전 등록 (김유환): 베이스라인(재구매 + 인기)에 UME 후보를 더하는 실무 파이프라인 — s4 (학습 없음)
# 근거: 8차 탐색 — B2 280 + UME가 s2 · main 모두 B2 단독보다 높음(+0.0027, +0.0068). UME의 이득은 기존 상품, 이미지의 역할은
#       신규 · 희소 상품(B2가 거의 0)에서 큼(5차 H8 · 결합 분석). 그래서 남는 자리를 신규 · 희소 상품 전용으로 쓰는 설계를 함께 검정한다.
# 이 파일의 커밋 시점이 설계 동결 시점이다. s4의 B2 계산과 분석은 이 커밋 이후에 한다.

status: final
registered: 2026-10-19
owner: 김유환
hypothesis_ids: [YH_b2_plus_ume, YH_b2_plus_ume_cold_slots]
question: "강한 단순 베이스라인의 마지막 일부 자리를 UME 후보(또는 UME가 고른 희소 · 신규 상품)로 바꾸면 베이스라인보다 나아지는가"

data:
  split: s4   # 테스트 2020-08-19 ~ 25
disclosure: >
  s4에서 이미 본 것: UME(텍스트만 C0 + 이미지만 C1) 단독 R 0.1177 등 7차 결과. B2는 s4에서 계산한 적 없고, B2와 UME의 결합도 본 적 없다.
  B2 + UME 결합은 s2 · main에서 탐색으로 봤다(8차) — 이 결과로 n = 280을 정했다.

candidates:
  b2: "고객의 최근 구매(재구매) + 직전 1주 인기 상품, 300개 (baselines.run, 묶음 YH7_BASE)"
  ume: "7차 YH5_UME/s4의 C0 + C1 벡터로 고객별 z 점수 합(w = 1), seed 42 · 43 · 44 짝 (8차와 같은 방법)"
  plain_slots: "B2 앞 280개 + UME 후보를 순서대로 중복 없이 20개 (5 · 8차 결합 규칙)"
  cold_slots: >
    B2 앞 280개 + UME 후보 중 '학습 데이터(테스트 주 이전 history) 판매 10회 미만' 상품만 순서대로 중복 없이 20개.
    모자라면 남은 자리를 UME 일반 후보로 채운다 (모자란 고객 비율 보고)
seeds: [42, 43, 44]
measure:
  primary: "R = 고객별 평균 Recall@300, 구간 all. 세 seed 평균"
  bootstrap: {n: 1000, unit: customer, paired: true, seed: 42}

confirmatory:
  correction: bonferroni   # 2개
  ci_level: 0.975
  H18:
    name: "B2 + UME 20자리"
    comparison: "R(B2 280 + UME 20) − R(B2 단독)"
    decision: "97.5% 구간 하한 > 0 이면 지지"
  H19:
    name: "B2 + 희소 · 신규 전용 UME 20자리"
    comparison: "R(B2 280 + 희소 · 신규 전용 UME 20) − R(B2 단독)"
    decision: "97.5% 구간 하한 > 0 이면 지지"
  report_regardless: true

exploratory:
  - "희소 · 신규 전용 − 일반 UME 자리 (구간 all · established · sparse · new_item)"
  - "자리 수 10 · 20 · 50 (전용 · 일반)"
  - "같은 설계를 s2 · main에 적용 (전용 자리는 처음 보는 결과, 일반 자리는 8차와 같음)"
  - "UME 대신 함께 학습 C2로 자리를 채운 경우 (s4: YH5_ENC C2는 벡터가 없으므로 후보 목록으로만)"
