# 5차 사전 등록 (김유환): 사후 결과의 확증(인코더 사전학습 · 희소 상품)과 실제 추천 파이프라인에서의 이미지 가치 (s2 분할)
# 노션: 1-2 (사전학습), 3-2 (구매 기록이 적은 상품), 신규 (베이스라인과 결합)
# 이 파일의 커밋 시점이 설계 동결 시점이다. 아래 학습 · 베이스라인 · 분석은 모두 이 커밋 이후에 한다.

status: final
registered: 2026-10-14
owner: 김유환
hypothesis_ids: [YH_pretrain_confirm, YH_sparse_confirm, YH_hybrid_value]
question: >
  (RQ1) 같은 구조에서 사전학습 데이터가 다르면 이미지 기여가 달라지는가 — main 사후 결과의 확증
  (RQ3) 구매 기록이 적은(희소) 상품에서 이미지 기여가 더 큰가 — main 사후 결과의 확증
  (실용) 강한 단순 베이스라인(재구매 + 인기) 후보에 모델 후보를 더하는 실제 파이프라인에서도 이미지가 도움이 되는가

data:
  split: s2   # 테스트 2020-09-02 ~ 08 (4차에서 만든 분할, prereg_yh_imgdrop.yaml 참고)
disclosure: >
  4차(이미지 드롭아웃) 분석에서 s2의 C2 · C3에 대해 구간 all · established · new_item의 R을 이미 봤다.
  그래서 new_item − established 비교는 확증에서 제외하고 탐색으로만 보고한다.
  sparse 구간, 다른 인코더(LAION · OpenAI CLIP · SigLIP · ResNet), 텍스트만(C0), 베이스라인 결합은 s2에서 아직 보지 않았다.

model: "ID 없는 Two-Tower, 이어 붙이기, h2. 드롭아웃 없음 (1 · 2차와 같은 조건)"
runs:
  new: "s2에서 C0 · L2 · L3 · C10 · C11 · S2 · S3 · C6 · C7 × seed 42 · 43 · 44 (묶음 YH3_ENC), 베이스라인 B1 · B2 (묶음 YH3_BASE)"
  reuse: "C2 · C3 (묶음 YH2_BASE, s2)"
seeds: [42, 43, 44]

hybrid:
  rule: "고객마다 B2(재구매 + 인기) 후보 앞에서 200개, 이어서 모델 후보를 순서대로 중복 없이 채워 300개"
  n_baseline: 200
  sweep_exploratory: [0, 100, 150, 200, 250, 280, 300]

measure:
  bootstrap: {n: 1000, unit: customer, paired: true, seed: 42}
  seed_aggregation: "seed별로 계산해 평균, 모든 조건이 같은 부트스트랩 추출 공유"

confirmatory:
  correction: bonferroni   # 3개
  ci_level: 0.98333
  H7:
    name: "사전학습 데이터 (RQ1)"
    comparison: "상대 내용 기여도, 구간 all: LAION-2B CLIP B/32(L2 · L3) − OpenAI CLIP B/32(C10 · C11)"
    decision: "차이의 98.33% 부트스트랩 구간 하한 > 0 이면 지지"
  H8:
    name: "희소 상품 (RQ3)"
    comparison: "Marqo(C2 · C3), 절대 내용 기여도: 구간 sparse − 구간 established"
    decision: "차이의 98.33% 부트스트랩 구간 하한 > 0 이면 지지"
  H9:
    name: "실제 파이프라인에서의 이미지 가치"
    comparison: "R_all(B2 200 + 텍스트 + Marqo 모델 C2) − R_all(B2 200 + 텍스트만 모델 C0)"
    decision: "차이의 98.33% 부트스트랩 구간 하한 > 0 이면 지지"
  report_regardless: true

exploratory:
  - "범용 SigLIP B/16 − ResNet-50 상대 내용 기여도 (main 사후 결과의 재현)"
  - "인코더 6종 × 구간별 R · 상대 · 절대 내용 기여도, 그리고 '같은 벡터 대조군'(4차 YH_CN0) 대비 R 차이"
  - "new_item − established (이미 일부 봄, 확증 아님)"
  - "결합: B2 단독 대비 개선, 구간별(특히 new_item), n_baseline 스윕, 모델을 이미지 드롭아웃 0.3(4차 YH_VD3R)으로 바꾼 경우"
  - "B1 · B2 단독 R (s2)"
