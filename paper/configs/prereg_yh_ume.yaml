# 8차 사전 등록 (김유환): 텍스트 · 이미지 모델을 따로 학습해 점수를 합치는 방식(UME)의 확증 — s2 (확증), main (재현)
# 근거: 7차 H14 지지(s4, UME − 함께 학습 +0.0210), 7차 사후 탐색(같은 모달리티 앙상블: 텍스트 + 텍스트 0.0973,
#       이미지 + 이미지 0.1013 < 텍스트 + 이미지 0.1177). 모델 수를 맞춘 공정 비교와 앙상블 효과 배제가 필요하다.
# 이 파일의 커밋 시점이 설계 동결 시점이다. 아래 학습 · 분석은 모두 이 커밋 이후에 한다.

status: final
registered: 2026-10-19
owner: 김유환
hypothesis_ids: [YH_ume_vs_joint_ensemble, YH_ume_vs_same_modality, YH_ume_hybrid]
question: "텍스트와 이미지를 함께 쓸 때, 한 모델로 함께 학습하는 대신 따로 학습해 점수를 합치면 더 좋은가 — 모델 수를 맞춰도, 같은 모달리티 앙상블보다도, 베이스라인과 결합해도"

data:
  confirm_split: s2    # 테스트 2020-09-02 ~ 08. UME · 앙상블은 이 주에서 계산한 적 없음
  replicate_split: main  # 테스트 2020-09-16 ~ 22. UME · 앙상블은 계산한 적 없음 (탐색 재현)
disclosure: >
  s2에서 이미 본 것: C0 · C1(6차 YH4) · C2의 단독 R, B2 단독과 B2 + C2 · C0 결합(5차). UME · 앙상블 · B2 + UME는 보지 않았다.
  학습이 결정적이라 C0 · C1 · C2를 다시 학습하면 기존과 같은 추천이 나온다 (확인 항목으로 보고).

model: "ID 없는 Two-Tower, h2. 모든 실행에서 정규화된 고객 · 상품 벡터 저장"
ensemble:
  method: "모델별 고객 × 전체 상품 점수(내적)를 고객별로 표준화(z)해 가중합한 상위 300개. 가중치는 모두 1 (7차와 같음)"
  ume: "텍스트만 C0 + 이미지만 C1, 같은 seed끼리"
  same_modality: "같은 조건의 서로 다른 seed 쌍 (42, 43) · (43, 44) · (44, 42)"
  joint_ensemble: "함께 학습한 C2의 서로 다른 seed 쌍 (위와 같은 짝)"
hybrid:
  method: "고객마다 B2(재구매 + 인기) 앞 200개 + 모델 후보를 순서대로 중복 없이 채워 300개 (5차와 같은 규칙)"
  b2_runs: {s2: "outputs/YH3_BASE/s2/B2_seed0", main: "outputs/C/main/B2_seed0"}
seeds: [42, 43, 44]
measure:
  primary: "R = 고객별 평균 Recall@300, 구간 all. 세 짝(seed 또는 seed 쌍)의 평균"
  bootstrap: {n: 1000, unit: customer, paired: true, seed: 42}

confirmatory:   # 모두 s2
  correction: bonferroni   # 3개
  ci_level: 0.98333
  H15:
    name: "모델 수를 맞춘 공정 비교"
    comparison: "R(UME: C0 + C1) − R(함께 학습 C2 두 개의 앙상블)"
    decision: "98.33% 구간 하한 > 0 이면 지지"
  H16:
    name: "앙상블 효과 배제"
    comparison: "R(UME: C0 + C1) − R(이미지만 C1 두 개의 앙상블)"
    decision: "98.33% 구간 하한 > 0 이면 지지 (7차 탐색에서 가장 강한 같은 모달리티 조합)"
  H17:
    name: "베이스라인 결합 파이프라인"
    comparison: "R(B2 200 + UME) − R(B2 200 + C2)"
    decision: "98.33% 구간 하한 > 0 이면 지지"
  report_regardless: true

exploratory:
  - "main 주에서 H15 · H16 · H17과 UME − C2 재현"
  - "UME − C2 (단일 모델 대비), 텍스트 + 텍스트 앙상블"
  - "이미지 인코더별 UME: C0 + SigLIP 이미지만(YH4_SI), C0 + ResNet 이미지만(C5) (s2)"
  - "세 모델 앙상블: C0 + C1 + C5 (s2), 같은 수의 C2 세 개 앙상블과 비교"
  - "가중치 w ∈ {0.5, 2}, 구간별(established · sparse · new_item), B2 결합 n 스윕 {100, 200, 250, 280}"
  - "재학습 결정성: 다시 학습한 C0 · C1 · C2의 추천이 기존 실행과 같은지"
