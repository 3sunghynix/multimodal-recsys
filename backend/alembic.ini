# Alembic 설정. DB URL 은 env.py 가 app.config.settings 에서 읽어오므로 여기엔 비워둔다.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

# 마이그레이션 파일 이름: 0001_description.py 형태
file_template = %%(rev)s_%%(slug)s

# 로그 설정은 FastAPI/uvicorn 이 이미 잡아놓으므로 최소화
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
