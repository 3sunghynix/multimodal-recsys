# 로컬 개발 환경: API + PostgreSQL(pgvector, 임베딩 검색 대비)
# 실행: docker compose up --build  →  API 문서 http://localhost:8000/docs
# 샘플 데이터: docker compose exec api python -m scripts.seed_sample
# Amazon dev_subset: data/dev_subset 에 내려받은 뒤 docker compose exec api python -m scripts.load_dev_subset --data /data/dev_subset
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recsys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recsys}
      POSTGRES_DB: ${POSTGRES_DB:-recsys}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recsys}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-recsys}:${POSTGRES_PASSWORD:-recsys}@db:5432/${POSTGRES_DB:-recsys}
      # 검색 모델(MiniLM · Marqo, 약 1GB)은 처음 한 번만 받아 hf_cache 볼륨에 저장된다.
      # 받은 뒤 .env에 HF_HUB_OFFLINE=1 → 시작할 때 인터넷 확인 없이 저장된 모델 사용 (백신 HTTPS 검사가 켜져 있어도 됨)
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${HF_HUB_OFFLINE:-0}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data          # dev_subset 등 적재용 (python -m scripts.load_dev_subset --data /data/dev_subset)
      - hf_cache:/root/.cache/huggingface   # 검색 모델 캐시 (컨테이너를 다시 만들어도 유지, down -v 하면 삭제)
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  hf_cache:
