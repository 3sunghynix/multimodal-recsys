# 시험용 확률이며 실제 고객 분포/전환율을 추정한 값이 아닙니다.
version: 0.3
status: seven_persona_local_pilot_aligned_with_team_decision
owner: 김광석
created: '2026-10-29'
provenance:
  reference: msrs_project/processed/retailrocket/sim_stats.json
  reference_received_as: user-provided screenshot; selected values transcribed
  probabilities: proposed synthetic settings; not calibrated
  names: 설계 방향 동의; 백엔드 계약과 선호 브랜드 선정 규칙 최종 확인 필요
  reviewer_statistics: Amazon brand concentration statistics quoted from team review;
    not independently recomputed
retailrocket_reference:
  usage: diagnostic reference only; not direct transition probabilities
  session_gap_minutes: 30
  event_share:
    view: 0.9667
    addtocart: 0.0252
    transaction: 0.0081
  visitor_ratios:
    view_to_cart: 0.0245
    view_to_buy: 0.008
  event_count_ratios:
    cart_per_view: 0.026
    buy_per_cart: 0.3239
  session_count: 1761675
  session_events_quantiles:
    q50: 1
    q75: 1
    q90: 2
    q99: 9
  session_cart_rate: 0.0249
  session_buy_rate: 0.0081
  repeat_buyer_rate: 0.2198
  view_share_top1pct_items: 0.227
pilot:
  status: seven_persona_local_pilot
  active_personas:
  - trendsetter
  - practical
  - value_seeker
  - brand_loyal
  - impulse_buyer
  - careful_explorer
  - window_shopper
  deferred_personas: []
  planned_customers: 700 # local pilot; 12,000 customers and multi-session generation are the next PR
  seed: 42
  # Default counts follow sampling_weight; CLI --customers-per-persona is a test override.
  sessions_per_customer: 1
  recommendations_per_session: 10
  max_requests_per_second: 2
  use_development_environment_only: true
  write_events: false
  on_missing_required_feature: block_affected_persona_and_report
  customer_source: sim
  history_source: processed/{amazon_v2,hm}/events.parquet filtered to split=train
  history_kind: synthetic preference-compatible history derived only from train catalog/interactions;
    not an actual cross-source person
  baseline_model_name: popularity
  require_backend_user_creation: true
  require_backend_idempotency_contract: true
  require_backend_exposure_attribution_contract: true
  on_ambiguous_post_before_idempotency: record_unknown_outcome_and_stop; do not automatically
    retry
  seed_history_in_experiment_metrics: false
  event_sequence:
  - view
  - click
  - add_to_cart
  - purchase
  log_only_displayed_items_as_view: true
  carry_recommendation_attribution:
  - experiment_id
  - variant
  - model_version_id
  persist_run_metadata_separately: true
behavior:
  status: synthetic_uncalibrated_proposal
  click:
    base_probability: 0.04
    minimum_probability: 0.005
    maximum_probability: 0.3
    preference_strength: 2.0
    preference_score_range:
    - 0
    - 1
    formula: clip(base_probability * exp(preference_strength * (score - 0.5)), minimum_probability,
      maximum_probability)
  add_to_cart:
    conditional_on: click_on_same_item_in_current_session
    probability: 0.1
  purchase:
    conditional_on: add_to_cart_on_same_item_in_current_session
    probability: 0.3
  allow_multiple_item_actions: true
  use_model_score_as_behavior_input: false
  use_variant_as_behavior_input: false
  use_model_name_as_behavior_input: false
features:
  brand_affinity:
    definition: 1 if item belongs to the customer's fixed preferred-brand set; otherwise
      0
    setup: fix preferred category first; uniformly sample brands without replacement
      from its train-only brand pool; persist choices before model assignment
    selection_status: proposal_for_team_confirmation
    min_train_items_per_brand_in_category: 3
    preferred_brand_count_candidates:
    - 1
    - 2
    - 3
    preferred_brand_count_sampling: uniform, capped by available brands
    use_popularity_weighted_brand_sampling: false
    on_empty_brand_pool: skip_customer_and_report; do not silently switch category
    initialization: sample initial purchased items from selected brands within the
      train pool; keep separate from A/B events
    stress_test_persona: brand_loyal
    real_population_representativeness_claim: false
  price_affinity:
    definition: clip(1 - item.price / customer.budget, 0, 1)
    setup: positive budget from the train-catalog price distribution within the preferred
      category
    budget_quantiles:
    - 0.25
    - 0.5
    - 0.75
    budget_sampling_weights:
    - 0.3333333333
    - 0.3333333333
    - 0.3333333334
    estimated_price_policy: use listed value but report price_source separately; no
      claim of actual willingness to pay
  popularity_affinity:
    definition: percentile rank of recent train-event counts, separately within each
      source catalog
    group_by: source
    count_rule: feedback>0 purchase rows from train only
    window_days: 7
    window_anchor: each source's own final train calendar day D
    interval: D-6 days 00:00 inclusive to D+1 day 00:00 exclusive; consistent source
      timestamp interpretation
    include_zero_count_catalog_items: true
    percentile_ties: average rank
    degenerate_source_policy: all equal counts -> neutral 0.5; report degenerate source
    history_end: fixed separately for amazon and hm before simulation; never current
      wall-clock day
    freeze_during_run: true
    note: do not pool 2020 H&M and 2023 Amazon counts/dates; recent popularity is
      not a measured fashion trend
  novelty_affinity:
    definition: 1 if both item and brand are absent from the customer's pre-experiment
      history; otherwise 0
    history_policy: initialize nonempty history from train; freeze preference-history
      features during the pilot
  familiarity_affinity:
    definition: 1 if product category occurs in initial train-derived history; otherwise
      0
    limitation: familiarity proxy, not quality/durability
  category_affinity:
    definition: 1 if category equals fixed preferred category, otherwise 0
personas:
- id: trendsetter
  name_ko: 트렌드세터
  pilot_enabled: true
  sampling_weight: 12
  budget_quantile: 0.75
  required_features:
  - popularity_affinity
  - novelty_affinity
  - price_affinity
  - brand_affinity
  preference_weights:
    popularity_affinity: 0.5
    novelty_affinity: 0.3
    price_affinity: 0.1
    brand_affinity: 0.1
  behavior_overrides:
    click_base_probability: 0.06
    cart_probability: 0.15
    purchase_probability: 0.35
  category_sampling:
    matching_terms:
    - 원피스·세트 > 원피스
    - 아우터
    - 상의
    matching_multiplier: 2
  purpose: recent source-specific popularity proxy; not actual fashion trend
- id: practical
  name_ko: 실용주의자
  pilot_enabled: true
  sampling_weight: 18
  budget_quantile: 0.5
  required_features:
  - repurchase_affinity
  - brand_affinity
  - price_affinity
  preference_weights:
    repurchase_affinity: 0.5
    price_affinity: 0.3
    brand_affinity: 0.2
  behavior_overrides:
    click_base_probability: 0.04
    cart_probability: 0.12
    purchase_probability: 0.45
  category_sampling:
    matching_terms:
    - 상의 > 티셔츠
    - 하의 > 청바지
    - 이너웨어 > 속옷
    - 이너웨어 > 양말·스타킹
    matching_multiplier: 3
  purpose: familiar category proxy; no measured durability or quality
- id: value_seeker
  name_ko: 가성비추구
  pilot_enabled: true
  sampling_weight: 18
  budget_quantile: 0.25
  required_features:
  - price_affinity
  - popularity_affinity
  - brand_affinity
  preference_weights:
    price_affinity: 0.7
    popularity_affinity: 0.2
    brand_affinity: 0.1
  behavior_overrides:
    click_base_probability: 0.04
    cart_probability: 0.08
    purchase_probability: 0.3
  category_sampling:
    matching_terms: [] # 전 카테고리 균등
    matching_multiplier: 1
  purpose: price/budget proxy; no measured product quality
- id: brand_loyal
  name_ko: 브랜드충성
  pilot_enabled: true
  sampling_weight: 12
  budget_quantile: 0.75
  required_features:
  - brand_affinity
  - repurchase_affinity
  - price_affinity
  preference_weights:
    brand_affinity: 0.8
    repurchase_affinity: 0.1
    price_affinity: 0.1
  behavior_overrides:
    click_base_probability: 0.05
    cart_probability: 0.15
    purchase_probability: 0.45
  category_sampling:
    matching_terms: [] # 선호 브랜드가 있는 카테고리에서 선택
    matching_multiplier: 1
  purpose: strong-brand stress test
- id: impulse_buyer
  name_ko: 충동구매
  pilot_enabled: true
  sampling_weight: 8
  budget_quantile: 0.9
  required_features:
  - novelty_affinity
  - popularity_affinity
  - price_affinity
  preference_weights:
    popularity_affinity: 0.4
    novelty_affinity: 0.4
    price_affinity: 0.2
  behavior_overrides:
    click_base_probability: 0.08
    cart_probability: 0.25
    purchase_probability: 0.5
  category_sampling:
    matching_terms:
    - 가방·지갑
    - 액세서리
    - 상의
    matching_multiplier: 3
  purpose: higher immediate synthetic conversion
- id: careful_explorer
  name_ko: 신중탐색
  pilot_enabled: true
  sampling_weight: 17
  budget_quantile: 0.5
  required_features:
  - brand_affinity
  - price_affinity
  - novelty_affinity
  preference_weights:
    novelty_affinity: 0.5
    price_affinity: 0.3
    brand_affinity: 0.2
  behavior_overrides:
    click_base_probability: 0.05
    cart_probability: 0.06
    purchase_probability: 0.15
  category_sampling:
    matching_terms: [] # 전 카테고리 탐색
    matching_multiplier: 1
  purpose: lower immediate conversion; no cross-session deliberation claim
- id: window_shopper
  name_ko: 눈팅형
  pilot_enabled: true
  sampling_weight: 15
  budget_quantile: 0.5
  initial_history:
    size_choices: [0, 1, 2]
    weights: [0.5, 0.25, 0.25]
  required_features:
  - novelty_affinity
  - popularity_affinity
  - price_affinity
  preference_weights:
    popularity_affinity: 0.5
    novelty_affinity: 0.3
    price_affinity: 0.2
  behavior_overrides:
    click_base_probability: 0.02
    cart_probability: 0.05
    purchase_probability: 0.2
  category_sampling:
    matching_terms:
    - 상의
    matching_multiplier: 1
  purpose: low engagement; purchases remain possible
session_probability_sanity_check:
  status: hypothetical neutral score; not observed simulation output
  assumptions: 10 independent displayed items, score=0.5, fixed click/cart/purchase
    probabilities
  any_cart_formula: 1 - (1 - 0.04 * 0.10)^10
  any_purchase_formula: 1 - (1 - 0.04 * 0.10 * 0.30)^10
  calibration_claim: false
backend_contract:
  status: pending Hyungwoo PR and agreement; no assumption that planned fields work
    today
  create_user_planned: POST /users {source, persona, source_user_id}
  assignment_owner: server GET /recommend/{user_id}; fixed by customer and experiment
    hash
  currently_available_attribution:
  - model_version_id
  - experiment_id
  - variant
  planned_attribution:
  - request_id
  - impression_id or agreed equivalent
  event_deduplication_proposal: client-generated event UUID, persisted once per logical
    event and reused on retries; server unique key/upsert required
  event_type_specific_uniqueness: true
  send_unsupported_fields: false
  server_created_at: receipt time only; do not send unsupported simulated timestamps
  logical_time_storage: separate local run log until server contract supports it
  feedback_and_split_storage: parquet only, not current DB
  price_storage: DB
  price_source_storage: parquet metadata until backend column is available
reporting:
  primary_comparison: models within the same persona, relative to the popularity baseline
  compare_raw_ctr_across_personas_as_model_quality: false
  relative_uplift_formula: (model_metric - popularity_metric) / popularity_metric
  on_zero_baseline_metric: relative uplift undefined; report counts and absolute difference
  show_absolute_percentage_point_difference: true
  lock_baseline_model_version_and_run_settings: true
  combined_summary: secondary only, with a fixed declared persona mixture
  interpret_brand_loyal_as_stress_test: true
  distinguish_simulation_from_real_user_results: true
  report_by_persona_and_variant: true
  report_customer_counts_and_denominators: true
  report_estimated_price_share: true
  report_source_exposure_share: true
  report_disabled_personas: true
  report_empty_recommendation_responses: true
  keep_offline_fixed_split_evaluation_separate: true
  persona_version: 0.3; historical IDs remain historical and must not be relabelled
